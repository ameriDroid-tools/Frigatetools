# Docker Compose file for an Ameridroid Frigate bundle (Frigate 0.17.x).
# Based on the official example at https://docs.frigate.video/frigate/installation
#
# Put this file in ~/frigate/ next to the "config" and "storage" folders:
#
#   ~/frigate/
#   ├── docker-compose.yml   <- this file
#   ├── config/
#   │   └── config.yml       <- starter config from this repo
#   └── storage/             <- recordings, snapshots, exports
#
# Start Frigate from ~/frigate with:   docker compose up -d

services:
  frigate:
    container_name: frigate # The camera installer looks for this name by default.
    restart: unless-stopped
    stop_grace_period: 30s # Give Frigate time to shut down cleanly.

    # Pinned to Frigate 0.17.x. The camera installer only supports 0.17.x.
    # Do not use the "stable" tag (it now points at 0.18+) or a 0.18+ tag.
    # Which 0.17.2 image matches this bundle depends on the CPU. Check with:
    #   uname -m
    #   x86_64   Intel/AMD -> 0.17.2
    #   aarch64  ARM       -> 0.17.2-standard-arm64
    # A shipped bundle already has the matching line active. Otherwise leave
    # one image line uncommented and comment out the other.
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    # image: ghcr.io/blakeblackshear/frigate:0.17.2-standard-arm64

    # Shared memory for decoded frames. 512mb is Frigate's compose example.
    # More cameras may need a larger value. See "Calculating required shm-size":
    # https://docs.frigate.video/frigate/installation/#calculating-required-shm-size
    shm_size: "512mb"

    # Detector and video-device access varies by bundle and is preconfigured
    # on a shipped system. Examples from the Frigate docs; uncomment only the
    # lines that match this hardware, or follow those docs:
    # https://docs.frigate.video/configuration/object_detectors
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb               # USB Coral
    #   - /dev/apex_0:/dev/apex_0                 # PCIe Coral
    #   - /dev/dri/renderD128:/dev/dri/renderD128 # Intel / AMD GPU (VAAPI)
    #   - /dev/hailo0:/dev/hailo0                 # Hailo-8 / Hailo-8L

    volumes:
      - /etc/localtime:/etc/localtime:ro # Use the box's time zone.
      # The config FOLDER is mounted (not just config.yml). The camera
      # installer requires this, so do not change it to a single-file mount.
      - ./config:/config
      # Recordings, snapshots, and exports. A bundle with a separate drive
      # already points this at that drive. Otherwise this folder is used.
      - ./storage:/media/frigate
      - type: tmpfs # 1 GB in-memory cache for recording segments
        target: /tmp/cache
        tmpfs:
          size: 1000000000

    ports:
      - "8971:8971" # Web interface (login required, HTTPS)
      # - "5000:5000" # Internal UNAUTHENTICATED access. Leave this off.
      - "8554:8554" # RTSP restream feeds
      - "8555:8555/tcp" # WebRTC over TCP
      - "8555:8555/udp" # WebRTC over UDP
