# Frigate 0.17.x starter configuration for ameriDroid Frigate bundles.
#
# This file intentionally contains NO cameras. Frigate 0.17 starts fine
# with an empty camera list; add cameras afterwards with the ameriDroid
# camera installer (add_camera_v2.py), which edits this file for you.
#
# Keep this file named exactly "config.yml" inside the folder that is
# mounted to /config in docker-compose.yml.

mqtt:
  enabled: false # No MQTT broker is needed. Turn on later for Home Assistant.

# Object detector. Preconfigured per bundle; hardware is not the same on
# every offering. With no detectors section, Frigate uses its CPU detector.
# Commented example only. Set this from the Frigate docs if this file does
# not already match the bundle:
# https://docs.frigate.video/configuration/object_detectors
#
# detectors:
#   <DETECTOR_NAME>:
#     type: <DETECTOR_TYPE>

# Video decoding acceleration. Also preconfigured per bundle.
# Commented example only. Presets are listed in the Frigate docs:
# https://docs.frigate.video/configuration/hardware_acceleration_video
#
# ffmpeg:
#   hwaccel_args: <HWACCEL_PRESET>

# Leave the next line as-is. The camera installer adds cameras here.
cameras: {}

version: 0.17-0
